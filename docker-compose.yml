services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: segment-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: segment
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./uploads:/app/uploads

  postgres:
    image: postgis/postgis:16-3.4
    container_name: segment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: segment
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d segment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
