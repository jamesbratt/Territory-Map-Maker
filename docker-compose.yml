services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: segment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: segment
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d segment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
